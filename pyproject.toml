[project]
name = "harness"
version = "0.1.0"
description = "Horus pseudonymisiert Texte lokal. Sensible Angaben maskieren, nach Freigabe kopieren und in der Antwort lokal wieder einsetzen."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "gliner>=0.2.16",
    "protobuf>=7.36.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "sentencepiece>=0.2.3",
]

[project.scripts]
harness = "harness.cli:main"

[project.optional-dependencies]
web = ["fastapi", "uvicorn", "pypdf"]

[dependency-groups]
dev = ["pytest>=8"]
browser = ["playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: lädt das GLiNER-Modell (Netz; frischer HF_HOME-Cache 1.133.200 KiB, gemessen am 06.11.2026 auf macOS 26.6.1, Apple M4, WLAN an); läuft nur mit -m slow"]
