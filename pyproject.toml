[project]
name = "harness"
version = "0.1.0"
description = "Lokaler Pseudonymisierungs-Harness: sensible Angaben maskieren, nur nach Freigabe an Claude senden, lokal zurückübersetzen."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "gliner>=0.2.16",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: lädt das GLiNER-Modell (Netz, mehrere hundert MB); läuft nur mit -m slow"]
